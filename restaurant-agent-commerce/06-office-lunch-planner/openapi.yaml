# OpenAPI 3.1 spec for the Office Lunch Planner API.
# Generated from the deployed JSON spec (src/routes/restaurant-suite/specs/office-lunch-planner.json) —
# the JSON is the source of truth served live at https://orbis-apis.onrender.com/office-lunch-planner.

openapi: 3.1.0
info:
  title: Office Lunch Planner API
  version: 1.0.0
  summary: Plan team lunch — collect preferences, build a group order, optimize budget, and prepare a
    (human-approved) checkout.
  description: Agent-native group-lunch planning for workplaces. Given people_count, budget, dietary_restrictions,
    and cuisine_preferences, returns a suggested_order, per_person_cost, substitutions, and delivery_eta.
    The final /prepare-checkout step is execution-gated and requires explicit human approval before any
    payment or order submission. Built for executive assistant and workplace-ops agents.
  contact:
    name: Restaurant Agent Commerce APIs
    url: https://orbis-apis.onrender.com/office-lunch-planner
  license:
    name: Commercial
x-agent-callable: true
x-mcp-compatible: true
x-pricing:
  model: per_call
  currency: USD
  billing: prepaid_credits
  free_endpoints:
  - GET /
  endpoint_pricing:
    GET /: 0.0
    POST /plan-office-lunch: 0.25
    POST /collect-preferences: 0.02
    POST /build-group-order: 0.1
    POST /optimize-budget: 0.05
    POST /prepare-checkout: 0.1
    POST /submit-order: 0.5
  notes: plan-office-lunch is the one-call workflow. prepare-checkout is a no-charge- risk preview; submit-order
    is execution-gated and bills only on approved execution.
x-privacy:
  pii_handling: minimized
  attendee_data: first_name_and_diet_only
  retention_days: 14
  compliance:
  - CCPA
  - GDPR_legitimate_interest
  data_sources:
  - caller_supplied_preferences
  - public_menu_data
  - delivery_marketplace_apis
x-chain-to:
- api: Local Restaurant Discovery API
  endpoint: POST /match-restaurant-to-intent
  reason: Source candidate restaurants for the team's cuisine preferences.
- api: Multi-Restaurant Ordering API
  endpoint: POST /price-order
  reason: Cross-check pricing across multiple restaurants.
- api: Catering Procurement API
  endpoint: POST /source-catering-options
  reason: Escalate large teams to catering vendors.
servers:
- url: https://orbis-apis.onrender.com/office-lunch-planner
  description: Orbis hosted
security:
- ApiKeyAuth: []
tags:
- name: discovery
- name: planning
- name: checkout
paths:
  /:
    get:
      operationId: getDiscovery
      tags:
      - discovery
      summary: Service discovery and capability manifest.
      description: Zero-cost capability manifest with endpoints, pricing, execution gates, chaining, and
        envelope metadata.
      security: []
      x-pricing:
        price: 0.0
      responses:
        '200':
          description: Capability manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResponse'
              example:
                service: Office Lunch Planner API
                version: 1.0.0
                agent_callable: true
                mcp_compatible: true
                auth:
                  type: api_key
                  header: X-API-Key
                endpoints:
                - method: POST
                  path: /plan-office-lunch
                  price_usd: 0.25
                  gated: false
                - method: POST
                  path: /collect-preferences
                  price_usd: 0.02
                  gated: false
                - method: POST
                  path: /build-group-order
                  price_usd: 0.1
                  gated: false
                - method: POST
                  path: /optimize-budget
                  price_usd: 0.05
                  gated: false
                - method: POST
                  path: /prepare-checkout
                  price_usd: 0.1
                  gated: false
                - method: POST
                  path: /submit-order
                  price_usd: 0.5
                  gated: true
                one_call_workflow: POST /plan-office-lunch
                execution_gates:
                - POST /submit-order
                confidence:
                  score: 1.0
                  level: high
                  rationale: Static capability manifest; deterministic.
                privacy:
                  pii_included: false
                  retention_days: 14
                  compliance:
                  - CCPA
                  - GDPR_legitimate_interest
                  data_sources:
                  - caller_supplied_preferences
                  - public_menu_data
                  - delivery_marketplace_apis
                  attendee_data: first_name_and_diet_only
                recommended_actions_priority_order:
                - priority: 1
                  action: Call POST /plan-office-lunch to run the full workflow in a single call.
                  rationale: The bundled workflow is the fastest path to a complete result.
                chain_to:
                - api: Local Restaurant Discovery API
                  endpoint: POST /match-restaurant-to-intent
                  reason: Source candidate restaurants for the team's cuisine preferences.
                - api: Multi-Restaurant Ordering API
                  endpoint: POST /price-order
                  reason: Cross-check pricing across multiple restaurants.
                - api: Catering Procurement API
                  endpoint: POST /source-catering-options
                  reason: Escalate large teams to catering vendors.
  /plan-office-lunch:
    post:
      operationId: planOfficeLunch
      tags:
      - planning
      summary: One-call workflow — plan a complete team lunch.
      description: Orchestrates collect-preferences + build-group-order + optimize-budget. Returns suggested_order,
        per_person_cost, substitutions, delivery_eta, and approval_required. Does NOT pay or submit —
        that requires the gated /prepare-checkout step.
      x-pricing:
        price: 0.25
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
            example:
              people_count: 12
              budget:
                total_usd: 240
                per_person_cap_usd: 22
              dietary_restrictions:
              - vegetarian
              - gluten_free
              - nut_allergy
              cuisine_preferences:
              - mediterranean
              - mexican
              delivery_window:
                date: '2026-06-10'
                earliest: '11:45'
                latest: '12:15'
              location:
                city: Austin
                state: TX
                address: 300 Congress Ave
      responses:
        '200':
          description: Complete lunch plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LunchPlanResponse'
              example:
                request_id: req_lunch_8f3a21c7
                confidence:
                  score: 0.91
                  level: high
                  rationale: Strong menu coverage for Mediterranean and Mexican with verified vegetarian,
                    gluten-free, and nut-free options within the per-person cap.
                privacy:
                  pii_included: true
                  attendee_data: first_name_and_diet_only
                  retention_days: 14
                  compliance:
                  - CCPA
                  - GDPR_legitimate_interest
                  data_sources:
                  - caller_supplied_preferences
                  - public_menu_data
                  - delivery_marketplace_apis
                recommended_actions_priority_order:
                - priority: 1
                  action: Review the suggested order and confirm dietary coverage with the team.
                  rationale: Final menu should be validated before any payment is initiated.
                - priority: 2
                  action: Call /prepare-checkout to preview totals, tip, and delivery ETA.
                  rationale: Assembles a no-charge checkout summary for human review.
                  chain_to_endpoint: POST /prepare-checkout
                - priority: 3
                  action: Obtain human approval, then submit via the gated /submit-order endpoint.
                  rationale: Payment and order submission only occur at the execution-gated step.
                  chain_to_endpoint: POST /submit-order
                chain_to:
                - api: Local Restaurant Discovery API
                  endpoint: POST /match-restaurant-to-intent
                  reason: Source additional candidate restaurants for the team's cuisine preferences.
                - api: Multi-Restaurant Ordering API
                  endpoint: POST /price-order
                  reason: Cross-check pricing across multiple restaurants before checkout.
                people_count: 12
                suggested_order:
                  order_id: ord_44
                  restaurant_name: Verde Mediterranean Kitchen
                  line_items:
                  - item: Falafel Mezze Platter (serves 4)
                    quantity: 2
                    unit_price_usd: 38.0
                    dietary_tags:
                    - vegetarian
                    - vegan
                    - nut_free
                    serves: 4
                  - item: Grilled Chicken Shawarma Bowl
                    quantity: 4
                    unit_price_usd: 13.5
                    dietary_tags:
                    - gluten_free
                    - nut_free
                    serves: 1
                  - item: Gluten-Free Veggie Quesadilla
                    quantity: 3
                    unit_price_usd: 11.0
                    dietary_tags:
                    - vegetarian
                    - gluten_free
                    - nut_free
                    serves: 1
                  - item: Mixed Greens & Hummus Tray (serves 6)
                    quantity: 1
                    unit_price_usd: 24.0
                    dietary_tags:
                    - vegetarian
                    - vegan
                    - gluten_free
                    - nut_free
                    serves: 6
                  subtotal_usd: 187.0
                  delivery_fee_usd: 8.99
                  tax_usd: 15.44
                  total_usd: 211.43
                per_person_cost: 17.62
                substitutions:
                - from: Mixed Nut Baklava Tray
                  to: Mixed Greens & Hummus Tray (serves 6)
                  reason: Removed to honor the nut_allergy restriction.
                  price_delta_usd: -6.0
                - from: Flour Tortilla Quesadilla
                  to: Gluten-Free Veggie Quesadilla
                  reason: Swapped to a gluten-free tortilla for the gluten_free restriction.
                  price_delta_usd: 4.5
                delivery_eta:
                  window_start: '11:45'
                  window_end: '12:15'
                  minutes: 35
                approval_required: true
                next_step:
                  description: Preview the checkout summary, then route payment and submission through
                    the gated step.
                  preview_endpoint: POST /prepare-checkout
                  gated_endpoint: POST /submit-order
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
  /collect-preferences:
