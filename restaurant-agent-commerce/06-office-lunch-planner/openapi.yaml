                  endpoint: POST /plan-office-lunch
                  reason: Next logical step in this API's workflow.
                suggested_order:
                  order_id: r_8cac04
                  restaurant_name: Mercantile Dining & Provision
                  line_items:
                  - item: general
                    quantity: 3
                    unit_price_usd: 1850.0
                    dietary_tags:
