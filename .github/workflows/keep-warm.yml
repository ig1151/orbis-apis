name: keep-warm

# Keep the Render web service warm so Orbis health checks never hit a cold start.
# Render's free tier spins the instance down after ~15 min idle; the first request
# then takes 30-60s, which trips Orbis's health-check timeout (auto-deactivates at 5
# consecutive fails). A single request wakes the whole instance — we ping the base
# URLs of the previously-flagged APIs every ~10 min to keep it awake with margin.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may run a few min late under load)
  workflow_dispatch: {}        # allow manual "Run workflow"

# If a run is still going when the next fires, don't pile up.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Orbis upstreams
        run: |
          BASE="https://orbis-apis.onrender.com"
          PATHS=(
            "/betting-odds"
            "/text-gen"
            "/news-search"
            "/lead-enrichment"
            "/app-store-lookup"
            "/wallet-address-risk"
            "/fear-greed"
            "/wallet-balance"
            "/image-to-content/v1"
          )
          fail=0
          for p in "${PATHS[@]}"; do
            # --max-time 70 tolerates a cold start; retry once so a single blip doesn't matter.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 70 --retry 1 --retry-delay 5 "$BASE$p" || echo "000")
            echo "GET $p -> $code"
            if [ "$code" = "000" ]; then fail=$((fail+1)); fi
          done
          echo "unreachable endpoints: $fail"
          # Don't fail the workflow on a single sleepy endpoint — the ping itself did the wake-up.
          exit 0
